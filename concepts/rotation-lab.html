<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Farmer direction check</title><style>body{font:16px system-ui;background:#f5f3ed;color:#294236;margin:30px auto;max-width:1080px;padding:20px}h1{margin-bottom:8px}p{color:#617164}canvas{display:block;background:#e8ecdf;border-radius:16px;width:100%;height:auto}button,a{padding:12px 18px;margin:8px 6px 8px 0;border:1px solid #b6c5b2;background:#fff;border-radius:7px;color:#294236;cursor:pointer}a{display:inline-block;text-decoration:none}#status{min-height:25px}</style><h1>New farmer · four isometric directions</h1><p>Four separately generated transparent sprites. Left/right change facing; forward follows that exact tile diagonal.</p><canvas width="1080" height="650"></canvas><button id="left">Turn left</button><button id="forward">Forward one tile</button><button id="right">Turn right</button><button id="reset">Reset</button><a href="puzzle-workshop.html">Play the new refill puzzle →</a><p id="status">Loading…</p><script>
(async()=>{const dirs=['north','east','south','west'],labels=['N · upper-right ↗','E · lower-right ↘','S · lower-left ↙','W · upper-left ↖'];const images={},bounds={"north":[349,49,478,1176],"east":[316,57,541,1194],"south":[308,56,530,1212],"west":[316,55,509,1199],"ground":[79,537,1089,710],"pump":[129,135,790,1005]};await Promise.all([...dirs,'ground','pump'].map(k=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>{images[k]=im;resolve()};im.onerror=reject;im.src='../images/concepts/rotation-v1/'+k+'.png'})));let facing=0,row=2,col=2;const ctx=document.querySelector('canvas').getContext('2d');function sprite(k,x,y,h){const b=bounds[k],w=h*b[2]/b[3];ctx.drawImage(images[k],...b,x-w/2,y-h,w,h)}function draw(){ctx.clearRect(0,0,1080,650);ctx.textAlign='center';ctx.font='bold 15px system-ui';ctx.fillStyle='#294236';dirs.forEach((d,i)=>{sprite(d,135+i*270,207,170);ctx.fillText(labels[i],135+i*270,237)});ctx.beginPath();ctx.moveTo(30,264);ctx.lineTo(1050,264);ctx.strokeStyle='#cad3c1';ctx.stroke();for(let sum=0;sum<=8;sum++)for(let r=0;r<5;r++){const c=sum-r;if(c<0||c>4)continue;const x=540+(c-r)*44,y=294+(r+c)*25.25;ctx.drawImage(images.ground,...bounds.ground,x-44,y,88,55);if(r===row&&c===col){ctx.beginPath();ctx.moveTo(x,y+25);ctx.lineTo(x+[44,44,-44,-44][facing]*.55,y+25+[-25,25,25,-25][facing]*.55);ctx.strokeStyle='#3f7763';ctx.lineWidth=3;ctx.stroke();sprite(dirs[facing],x,y+25,95)}}document.querySelector('#status').textContent=labels[facing]+' · tile ('+row+', '+col+')'}document.querySelector('#left').onclick=()=>{facing=(facing+3)%4;draw()};document.querySelector('#right').onclick=()=>{facing=(facing+1)%4;draw()};document.querySelector('#forward').onclick=()=>{const d=[[-1,0],[0,1],[1,0],[0,-1]][facing],r=row+d[0],c=col+d[1];if(r<0||r>4||c<0||c>4)return;row=r;col=c;draw()};document.querySelector('#reset').onclick=()=>{facing=0;row=col=2;draw()};window.rotationLab={get:()=>({facing:dirs[facing],row,col})};draw()})().catch(e=>document.querySelector('#status').textContent='Load error: '+e.message);
</script>
